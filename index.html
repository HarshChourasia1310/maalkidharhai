<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khata</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F1F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --paper:#F1F4EE; --band:#E1E8DC; --rule:#C3CFBC; --ink:#1C2A21;
    --muted:#6E7A6C; --spend:#B3341E; --saved:#2F6B4F; --moved:#42618C; --inflow:#8A6417;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust:100%;
    padding-bottom:calc(78px + env(safe-area-inset-bottom));
  }
  #app{max-width:460px;margin:0 auto;padding:0 16px}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  input,textarea,select{font:inherit;color:inherit}
  input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .small{font-size:12px}

  header{padding:20px 0 14px}
  header h1{font:600 26px/1.1 ui-serif, Georgia, "Times New Roman", serif;margin:0;letter-spacing:-.01em}
  header p{margin:3px 0 0;font-size:13px;color:var(--muted)}

  /* amount line */
  .amtline{display:flex;align-items:flex-end;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
  .amtline .rs{font:400 30px/1 ui-serif,Georgia,serif;color:var(--muted)}
  #amount{flex:1;min-width:0;background:none;border:0;outline:none;font-family:var(--mono);font-size:40px;padding:0;width:100%}
  #date{background:none;border:0;color:var(--muted);font-size:12px;outline:none;max-width:118px}

  /* tags */
  .tagsearch{width:100%;padding:11px 12px;background:none;border:1px solid var(--rule);
    outline:none;font-size:14px;margin-bottom:9px}
  .taggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .tagbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;
    padding:10px 8px;min-height:66px;font-size:12px;line-height:1.2;text-align:left;
    background:none;color:var(--ink);border:1px solid var(--rule);border-left-width:3px}
  .tagbtn[aria-pressed="true"]{color:var(--paper)}
  .tagbtn .ic{flex:none;opacity:.85}
  .tagbtn .hint{font-size:10.5px;opacity:.75}
  .showall{grid-column:1/-1;padding:10px;background:none;border:1px dashed var(--rule);
    color:var(--muted);font-size:12.5px}
  .noresult{grid-column:1/-1;color:var(--muted);font-size:13px;padding:14px 2px}
  .row .ic{flex:none;margin-top:1px}

  .subs{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .sub{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:none;color:var(--ink)}
  .sub[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  #note{width:100%;margin-top:14px;padding:12px;background:none;border:1px solid var(--rule);outline:none;font-size:14px}
  .primary{width:100%;margin-top:18px;padding:15px;border:0;background:var(--ink);color:var(--paper);font-size:15px}
  .primary[disabled]{background:var(--band);color:var(--muted);cursor:default}
  .ghost{padding:12px;border:1px solid var(--ink);background:none;color:var(--ink);font-size:14px}

  /* rows */
  .row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--band)}
  .row .spine{width:3px;align-self:stretch;flex:none}
  .row .body{flex:1;min-width:0}
  .row .what{font-size:14px;word-break:break-word}
  .row .meta{font-size:11px;color:var(--muted);margin-top:1px}
  .row .amt{font-family:var(--mono);font-size:14px;white-space:nowrap}
  .row .kill{background:none;border:0;color:var(--muted);font-size:19px;line-height:1;padding:0 2px}
  .row .more{background:none;border:0;color:var(--muted);padding:2px 4px;line-height:1;align-self:center}
  .toolbar{display:flex;justify-content:flex-end;gap:14px;margin:-10px 0 12px}
  .linkbtn{background:none;border:0;color:var(--muted);font-size:12.5px;padding:5px 0;text-decoration:underline}
  .flashbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--band);padding:10px 12px;margin-bottom:14px;font-size:13px}
  .flashbar .undo{background:none;border:0;color:var(--ink);font-size:13px;text-decoration:underline;padding:0}
  .menu{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .menu button{display:flex;align-items:center;gap:12px;padding:15px 4px;background:none;border:0;
    border-bottom:1px solid var(--band);color:var(--ink);font-size:15px;text-align:left}
  .menu button:last-child{border-bottom:0}
  .menu .danger{color:var(--spend)}
  .menuhead{font-size:13px;color:var(--muted);padding-bottom:2px}
  .lentrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--band)}
  .lentrow .who{flex:1;min-width:0;display:block;text-align:left;background:none;border:0;color:inherit;padding:0}
  .lentrow .who .nm{display:block}
  .lentrow .who .bits{display:block}
  .lentrow .who .nm{font-size:15px;word-break:break-word}
  .lentrow .who .bits{font-size:11.5px;color:var(--muted);margin-top:2px}
  .lentrow .out{font-family:var(--mono);font-size:15px;white-space:nowrap}
  .settle{background:none;border:1px solid var(--rule);color:var(--ink);font-size:12px;padding:7px 9px;white-space:nowrap}
  .delta{font-size:12.5px;color:var(--muted);margin-top:3px}
  .bd .cmp{font-size:12px;color:var(--muted);padding:2px 0 6px}

  .dayhead{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--rule);padding-bottom:4px;margin:22px 0 2px;font-size:12px;color:var(--muted)}

  .months{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
  .months::-webkit-scrollbar{display:none}
  .mbtn{white-space:nowrap;font-size:13px;padding:6px 12px;border:1px solid var(--rule);background:none;color:var(--ink)}
  .mbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  .headline{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
  .headline .big{font-family:var(--mono);font-size:42px;line-height:1.05}
  .headline .sub{font-size:13px;color:var(--muted);margin-top:5px}

  .bar{margin-bottom:12px}
  .bartap{display:block;width:100%;padding:0;background:none;border:0;color:inherit;text-align:left}
  .bartap .caret{color:var(--muted);font-size:11px;margin-left:5px}
  .bd{border-left:2px solid var(--band);padding-left:11px;margin:10px 0 16px}
  .bd .sr{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
  .bd .sr .n{min-width:0;word-break:break-word}
  .bd .en{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);padding:3px 0}
  .bd h4{margin:12px 0 2px;font:500 11.5px/1.3 inherit;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .bar .t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
  .bar .track{height:6px;background:var(--band);margin-top:5px}
  .bar .fill{height:100%;background:var(--spend)}

  .search{width:100%;padding:11px;background:none;border:1px solid var(--rule);outline:none;font-size:14px;margin-bottom:6px}

  nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom)}
  nav div{max-width:460px;margin:0 auto;display:flex}
  nav button{flex:1;padding:15px 0;background:none;border:0;border-top:2px solid transparent;color:var(--muted);font-size:14px}
  nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}

  .veil{position:fixed;inset:0;background:rgba(28,42,33,.45);display:flex;align-items:flex-end;z-index:50}
  .sheet{background:var(--paper);width:100%;max-height:86vh;display:flex;flex-direction:column;padding:16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0;font:500 15px/1.3 inherit}
  .sheet textarea{flex:1;min-height:190px;width:100%;font-family:var(--mono);font-size:11px;
    background:#fff;border:1px solid var(--rule);padding:10px;margin-top:12px;resize:none}
  .sheethead{display:flex;justify-content:space-between;align-items:center}
  .empty{color:var(--muted);font-size:14px;padding:26px 0}
  .flash{font-size:13px;margin-top:12px;color:var(--saved)}
  .warn{border:1px solid var(--spend);color:var(--spend);padding:12px;font-size:13px;margin-bottom:14px}
  @media (prefers-reduced-motion: no-preference){
    .flash{animation:fade .25s ease-out}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<header><div id="app"><h1>Khata</h1><p>Every rupee, tagged the day it leaves.</p></div></header>
<main id="app"><div id="view"></div></main>
<nav><div id="tabs"></div></nav>

<script>
/* ---------------- tags ---------------- */
var TYPE = {
  spend:{label:"Spent", color:"var(--spend)"},
  saved:{label:"Saved & invested", color:"var(--saved)"},
  moved:{label:"Moved around", color:"var(--moved)"},
  "in":{label:"Came back in", color:"var(--inflow)"}
};

var TAGS = [
 {n:"Food & drink", t:"spend", d:"Anything eaten or drunk that you didn't cook at home.",
  s:["Eat out","Takeaway","Fast food","Snacks","Swiggy","Zomato","Sweets","Liquor","Date","Pizza","Coffee","Other"]},
 {n:"Transport", t:"spend", d:"Getting yourself from one place to another in daily life.",
  s:["Uber","Cab","Auto","Bus","Train","Flight","Metro","Fuel","Parking","FASTag","Toll","Lounge access","Fine","Other"]},
 {n:"Shopping", t:"spend", d:"Things you buy to keep, rather than use up.",
  s:["Clothes","Footwear","Electronics","Festival","Games","Plants","Jewellery","Furniture","Decoratives","Appliances","Utensils","Cosmetics","Toys","Stationery","Glasses","Other"]},
 {n:"Groceries", t:"spend", d:"Raw kitchen supplies for cooking and eating at home.",
  s:["Staples","Vegetables","Fruit","Meat","Eggs","Fish","Bakery","Dairy","Zepto","Other"]},
 {n:"Home", t:"spend", d:"Running, fixing and improving the place you live in.",
  s:["Toiletries","Decor","Cleaning","Painting","Renovation","Repair","Pest control","Construction","Other"]},
 {n:"Entertainment", t:"spend", d:"Tickets and outings you pay to enjoy.",
  s:["Movies","Shows","Bowling","Concert","Standup","Other"]},
 {n:"Event", t:"spend", d:"Occasions you host or show up for.",
  s:["Party","Birthday","Wedding","Other"]},
 {n:"Travel", t:"spend", d:"Money spent while you're away from your home city.",
  s:["Activity","Camping","Hotel","Local commute","Meals","Visa fees","Hostels","Airbnb","Other"]},
 {n:"Medical", t:"spend", d:"Treatment, medicines and anything a clinic charges for.",
  s:["Medicine","Hospital","Clinic","Dentist","Hygiene","Other"]},
 {n:"Personal", t:"spend", d:"Looking after yourself outside of health and training.",
  s:["Self care","Grooming","Hobbies","Therapy","Other"]},
 {n:"Fitness", t:"spend", d:"Training, sport, and what you take to fuel it.",
  s:["Gym","Turf","Equipment","Nutrition","Other"]},
 {n:"Service", t:"spend", d:"Paying a person for their work or skill.",
  s:["Laundry","Tailor","Courier","Carpenter","Plumber","Mechanic","Photographer","Driver","Print","Xerox","Repair","Logistics","Other"]},
 {n:"Bill", t:"spend", d:"Recurring dues that arrive whether you spend or not.",
  s:["Rent","Water","Phone","Electricity","WiFi","Gas","House","Education","DTH","Cook","Maintenance","Other"]},
 {n:"Subscription", t:"spend", d:"Digital plans that renew on their own until stopped.",
  s:["Software","Spotify","Netflix","Prime","YouTube","Google","Apple","Hotstar","Bumble","PlayStation","Claude","GPT","Other"]},
 {n:"Support", t:"spend", d:"Money handed to family for their needs.",
  s:["Spouse","Dad","Parent","Sibling","Other"]},
 {n:"Gift", t:"spend", d:"Bought or given for someone else, with nothing expected back.",
  s:["Birthday","Wedding","Festival","Thank you","Other"]},
 {n:"Donation", t:"spend", d:"Given away to a cause, temple or person in need.",
  s:["Charity","Temple","Fundraiser","Tip","Other"]},
 {n:"Hidden charges", t:"spend", d:"Fees you never chose. Worth catching, and sometimes worth disputing.",
  s:["Convenience fee","Bank charge","GST","Late fee","Platform fee","Surge","Other"]},
 {n:"Misc.", t:"spend", d:"Real spending that genuinely fits nowhere else.",
  s:["Unsorted","Other"]},
 {n:"Investment", t:"saved", d:"Money put to work. It leaves the account but it is still yours.",
  s:["Stock","IPO","Mutual fund","SIP","Gold","FD","Other"]},
 {n:"Saving", t:"saved", d:"Money set aside on purpose, not spent.",
  s:["Emergency fund","Goal fund","RD","Other"]},
 {n:"Self transfer", t:"moved", d:"Your own money changing pockets between your accounts.",
  s:["Bank to bank","To wallet","From wallet","Other"]},
 {n:"Top up", t:"moved", d:"Loading a wallet before the real spending happens.",
  s:["Wallet","UPI Lite","Metro card","FASTag","Other"]},
 {n:"Cash withdrawal", t:"moved", d:"Cash out of the machine. Log the real purchase when you spend it.",
  s:["ATM","Counter","Other"]},
 {n:"Lent", t:"moved", d:"Given to someone on the understanding that it comes back.",
  s:["Friend","Family","Colleague","Other"]},
 {n:"Return", t:"in", d:"Money coming back to you: refunds, repayments, cashback.",
  s:["Refund","Repaid to me","Cashback","Reimbursement","Other"]}
];

var BY = {};
TAGS.forEach(function(t){ BY[t.n] = t; });

/* ---------------- icons ---------------- */
var DOT = ' fill="currentColor" stroke="none"';
var ICONS = {
 "Food & drink":'<path d="M7 3v6a2 2 0 0 0 4 0V3"/><path d="M9 11v10"/><path d="M17 3c-1.3 1.5-2 3.3-2 5.3 0 1.6.7 2.6 2 2.8V21"/>',
 "Transport":'<path d="M4.5 17v-4l2-4.6A2 2 0 0 1 8.3 7h7.4a2 2 0 0 1 1.8 1.4l2 4.6v4"/><path d="M4.5 13h15"/><circle cx="8.2" cy="17" r="1.6"/><circle cx="15.8" cy="17" r="1.6"/>',
 "Shopping":'<path d="M5 8h14l-1.2 12H6.2L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
 "Groceries":'<path d="M4 9h16l-1.6 10H5.6L4 9z"/><path d="M8 9 10.2 4"/><path d="M16 9 13.8 4"/><path d="M9.5 12.5v3M14.5 12.5v3"/>',
 "Home":'<path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/>',
 "Entertainment":'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10.5 9.2 15 12l-4.5 2.8V9.2z"/>',
 "Event":'<path d="M4 20.5h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6z"/><path d="M4 16.6h16"/><path d="M12 12.5V9.6"/><path d="M12 9c.9-1 .6-1.9 0-2.6-.6.7-.9 1.6 0 2.6z"/>',
 "Travel":'<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V5.6A1.6 1.6 0 0 1 10.6 4h2.8A1.6 1.6 0 0 1 15 5.6V8"/><path d="M3 13h18"/>',
 "Medical":'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 9v6M9 12h6"/>',
 "Personal":'<circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/>',
 "Fitness":'<path d="M4 9v6M7 6.5v11M17 6.5v11M20 9v6M7 12h10"/>',
 "Service":'<path d="M18.6 3.6 15.8 6.4l1.8 1.8 2.8-2.8a4.6 4.6 0 0 1-6 6L7.8 18a2.1 2.1 0 0 1-3-3l6.6-6.6a4.6 4.6 0 0 1 6-6z"/>',
 "Bill":'<path d="M6 3h8l4 4v14H6V3z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
 "Subscription":'<path d="M4 10a5.5 5.5 0 0 1 5.5-5.5H19"/><path d="M16.2 1.8 19.5 4.5l-3.3 2.7"/><path d="M20 14a5.5 5.5 0 0 1-5.5 5.5H5"/><path d="M7.8 22.2 4.5 19.5l3.3-2.7"/>',
 "Support":'<path d="M12 20s-7-4.4-7-9.1A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.9C19 15.6 12 20 12 20z"/>',
 "Gift":'<rect x="3.5" y="9" width="17" height="11" rx="1.5"/><path d="M3.5 13h17"/><path d="M12 9v11"/><path d="M12 9S9.6 9.1 8.5 8a2.3 2.3 0 0 1 3.3-3.3C12.6 5.5 12 9 12 9z"/><path d="M12 9s2.4.1 3.5-1a2.3 2.3 0 0 0-3.3-3.3C11.4 5.5 12 9 12 9z"/>',
 "Donation":'<rect x="4" y="11" width="16" height="9" rx="1.5"/><path d="M4 15h16"/><path d="M12 8.5V3"/><path d="M9.5 6 12 8.5 14.5 6"/>',
 "Hidden charges":'<path d="M12 4 2.6 20h18.8L12 4z"/><path d="M12 10.5v4.2"/><circle cx="12" cy="17.4" r="0.95"'+DOT+'/>',
 "Misc.":'<circle cx="5.6" cy="12" r="1.4"'+DOT+'/><circle cx="12" cy="12" r="1.4"'+DOT+'/><circle cx="18.4" cy="12" r="1.4"'+DOT+'/>',
 "Investment":'<path d="M3 17.5 9 11l4 4 8-8"/><path d="M15 7h6v6"/>',
 "Saving":'<ellipse cx="12" cy="6.4" rx="7" ry="2.7"/><path d="M5 6.4v5c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7v-5"/><path d="M5 11.4v5.2c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7v-5.2"/>',
 "Self transfer":'<path d="M4 9h13"/><path d="M14 6l3 3-3 3"/><path d="M20 15H7"/><path d="M10 12l-3 3 3 3"/>',
 "Top up":'<rect x="3" y="9" width="18" height="11" rx="2"/><path d="M3 13h18"/><path d="M15.5 16.5h2.5"/><path d="M12 2.5V7"/><path d="M9.6 4.9 12 2.5l2.4 2.4"/>',
 "Cash withdrawal":'<rect x="3" y="4" width="18" height="9" rx="1.5"/><circle cx="12" cy="8.5" r="2"/><path d="M12 16v6"/><path d="M9.5 19.5 12 22l2.5-2.5"/>',
 "Lent":'<circle cx="7" cy="7.6" r="3.2"/><path d="M2 19c0-3.2 2.3-4.9 5-4.9"/><path d="M12 15.5h8"/><path d="M17.2 12.7 20 15.5l-2.8 2.8"/>',
 "Return":'<path d="M19.5 6H9.6a5 5 0 0 0 0 10H15"/><path d="M12.2 13 9.2 16l3 3"/>'
};
function icon(name, size){
  var s = size || 18;
  return '<svg class="ic" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" '
    + 'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + (ICONS[name] || ICONS["Misc."]) + '</svg>';
}
var UI = {
  more:'<circle cx="12" cy="5.2" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="18.8" r="1.5" fill="currentColor" stroke="none"/>',
  edit:'<path d="M4.5 19.5h4L20 8 16 4 4.5 15.5v4z"/><path d="M14.5 5.5 18.5 9.5"/>',
  trash:'<path d="M4 7h16"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/><path d="M6.5 7 7.6 20h8.8L17.5 7"/><path d="M10.2 11v5.5M13.8 11v5.5"/>',
  again:'<path d="M4 10a5.5 5.5 0 0 1 5.5-5.5H19"/><path d="M16.2 1.8 19.5 4.5l-3.3 2.7"/><path d="M20 14a5.5 5.5 0 0 1-5.5 5.5H5"/><path d="M7.8 22.2 4.5 19.5l3.3-2.7"/>'
};
function ui(name, size){
  var z = size || 19;
  return '<svg viewBox="0 0 24 24" width="'+z+'" height="'+z+'" fill="none" stroke="currentColor" '
    + 'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+UI[name]+'</svg>';
}
var STARTER = ["Food & drink","Transport","Groceries","Shopping","Bill","Entertainment","Personal","Medical","Subscription"];

/* ---------------- storage ---------------- */
var KEY = "khata.entries.v1";
var memory = null;           // fallback when localStorage is unavailable
var storageBroken = false;

function load(){
  if(memory) return memory;
  try{
    var raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    storageBroken = true; memory = memory || [];
    return memory;
  }
}
function save(list){
  try{
    localStorage.setItem(KEY, JSON.stringify(list));
    memory = null;
  }catch(e){
    storageBroken = true; memory = list;
  }
}

/* ---------------- helpers ---------------- */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function ym(iso){ return iso.slice(0,7); }
function money(n){
  var dec = Math.round(n*100)%100 !== 0;
  return "\u20B9" + n.toLocaleString("en-IN", {minimumFractionDigits: dec?2:0, maximumFractionDigits: dec?2:0});
}
function monthName(m){
  var p = m.split("-");
  return new Date(+p[0], +p[1]-1, 1).toLocaleString("en-IN",{month:"long", year:"numeric"});
}
function dayLabel(iso){
  return new Date(iso+"T00:00:00").toLocaleString("en-IN",{weekday:"short", day:"numeric", month:"short"});
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function months(list){
  var set = {};
  list.forEach(function(e){ set[ym(e.date)] = 1; });
  set[ym(todayISO())] = 1;
  return Object.keys(set).sort().reverse();
}
function el(id){ return document.getElementById(id); }
function subsOf(e){
  if(Array.isArray(e.sub)) return e.sub.filter(Boolean);
  return e.sub ? [e.sub] : [];
}
function subLabel(e){ return subsOf(e).join(" \u00B7 "); }

/* ---------------- state ---------------- */
var state = {
  tab:"add",
  draft:{ amount:"", tag:null, subs:[], note:"", date:todayISO(), id:null },
  flash:"", undo:null,
  tagQuery:"", showAllTags:false, openTag:null, openPerson:null,
  ledgerMonth:null, ledgerQuery:"",
  summaryMonth:null
};

function hasLent(){
  return load().some(function(e){ return e.tag==="Lent"; });
}
function renderTabs(){
  var items = [["add","Add"],["ledger","Ledger"],["month","Month"]];
  if(hasLent()) items.push(["lent","Lent"]);
  items.push(["data","Data"]);
  el("tabs").innerHTML = items.map(function(p){
    return '<button data-tab="'+p[0]+'"'+(state.tab===p[0]?' aria-current="page"':'')+'>'+p[1]+'</button>';
  }).join("");
}

function render(){
  var v = el("view");
  var warn = storageBroken
    ? '<div class="warn">This browser is blocking storage, so entries will vanish when you close the tab. Open the page over https (your GitHub Pages link) rather than as a local file.</div>'
    : "";
  var fl = state.flash
    ? '<div class="flashbar"><span>'+esc(state.flash)+'</span>'
      + (state.undo ? '<button class="undo" data-undo="1">Undo</button>' : '') + '</div>'
    : "";
  warn = warn + fl;
  if(state.tab==="lent" && !hasLent()) state.tab = "add";
  if(state.tab==="add")         v.innerHTML = warn + viewAdd();
  else if(state.tab==="ledger") v.innerHTML = warn + viewLedger();
  else if(state.tab==="month")  v.innerHTML = warn + viewMonth();
  else if(state.tab==="lent")   v.innerHTML = warn + viewLent();
  else                          v.innerHTML = warn + viewData();

  renderTabs();
  window.scrollTo(0,0);
}

/* ---------------- add ---------------- */
function viewAdd(){
  var d = state.draft;
  var tag = d.tag ? BY[d.tag] : null;
  var ok = parseFloat(d.amount) > 0 && !!d.tag;
  var recent = load().slice().sort(byNewest).slice(0,5);

  var h = '<div class="amtline">'
    + '<span class="rs">\u20B9</span>'
    + '<input id="amount" inputmode="decimal" placeholder="0" aria-label="Amount" value="'+esc(d.amount)+'">'
    + '<input id="date" type="date" aria-label="Date" value="'+esc(d.date)+'">'
    + '</div>';

  if(d.amount || d.tag || d.note || d.id){
    h += '<div class="toolbar">'
       + (d.id ? '<button class="linkbtn" id="cancelEdit">Cancel edit</button>' : '')
       + '<button class="linkbtn" id="clearAll">Clear</button></div>';
  }
  h += '<input class="tagsearch" id="tagq" placeholder="Search tags or items, e.g. swiggy, fuel"'
     + ' aria-label="Search tags" value="'+esc(state.tagQuery)+'">'
     + '<div class="taggrid" id="taggrid">' + tagGridHTML() + '</div>';

  if(tag){
    h += '<p class="muted" style="font-size:13px;margin:16px 0 0">'+esc(tag.d)+'</p>'
       + '<p class="small muted" style="margin:6px 0 0">Pick as many as apply.</p><div class="subs">';
    tag.s.forEach(function(s){
      h += '<button class="sub" data-sub="'+esc(s)+'" aria-pressed="'+(d.subs.indexOf(s)>-1)+'">'+esc(s)+'</button>';
    });
    h += '</div>';
    h += '<input id="note" placeholder="What was it? e.g. chicken biryani, Amanora" aria-label="Item" value="'+esc(d.note)+'">';
  }

  h += '<button class="primary" id="saveBtn"'+(ok?"":" disabled")+'>'
     + (ok ? (d.id ? "Update this entry" : "Add "+money(parseFloat(d.amount))+" to "+esc(d.tag))
           : "Enter an amount and pick a tag")
     + '</button>';


  if(recent.length){
    h += '<p class="small muted" style="margin:28px 0 6px">Recent. Tap one to log it again, \u00D7 to delete it.</p>';
    recent.forEach(function(e){ h += rowHTML(e, true, "repeat"); });
  }
  return h;
}

function tagResults(){
  var q = state.tagQuery.trim().toLowerCase();
  var out = [];
  if(q){
    TAGS.forEach(function(t){
      if(t.n.toLowerCase().indexOf(q) > -1){ out.push({t:t, sub:null}); return; }
      t.s.filter(function(s){ return s !== "Other" && s.toLowerCase().indexOf(q) > -1; })
         .slice(0,3).forEach(function(s){ out.push({t:t, sub:s}); });
    });
    return out;
  }
  if(state.showAllTags) return TAGS.map(function(t){ return {t:t, sub:null}; });

  var count = {};
  load().forEach(function(e){ count[e.tag] = (count[e.tag]||0) + 1; });
  var picks = TAGS.filter(function(t){ return count[t.n]; })
                  .sort(function(a,b){ return count[b.n] - count[a.n]; })
                  .slice(0,9);
  STARTER.forEach(function(n){
    if(picks.length < 9 && BY[n] && picks.indexOf(BY[n]) < 0) picks.push(BY[n]);
  });
  return picks.map(function(t){ return {t:t, sub:null}; });
}

function tagGridHTML(){
  var d = state.draft, res = tagResults(), h = "";
  if(!res.length){
    return '<p class="noresult">No tag matches that. Try a shorter word, or open the full list.</p>'
      + '<button class="showall" data-showall="1">Show all 26 tags</button>';
  }
  res.forEach(function(r){
    var t = r.t, on = d.tag===t.n && (r.sub ? d.subs.indexOf(r.sub)>-1 : true);
    h += '<button class="tagbtn" data-tag="'+esc(t.n)+'"'
       + (r.sub ? ' data-picksub="'+esc(r.sub)+'"' : '')
       + ' aria-pressed="'+on+'" style="border-left-color:'+TYPE[t.t].color
       + (on ? ';background:'+TYPE[t.t].color+';border-color:'+TYPE[t.t].color : "") + '">'
       + icon(t.n)
       + '<span>'+esc(r.sub || t.n)+'</span>'
       + (r.sub ? '<span class="hint">'+esc(t.n)+'</span>' : '')
       + '</button>';
  });
  if(!state.tagQuery.trim()){
    h += '<button class="showall" data-showall="1">'
       + (state.showAllTags ? "Show fewer" : "Show all 26 tags") + '</button>';
  }
  return h;
}

function commitDraft(){
  var d = state.draft;
  var amt = parseFloat(d.amount);
  if(!(amt>0) || !d.tag) return;
  var list = load();
  if(d.id){
    list = list.map(function(e){
      return e.id===d.id ? {id:e.id, date:d.date, amount:amt, tag:d.tag, sub:d.subs.slice(), note:d.note.trim()} : e;
    });
    state.flash = "Entry updated.";
  }else{
    var twin = list.filter(function(e){
      return e.date===d.date && e.amount===amt && e.tag===d.tag;
    })[0];
    if(twin && !confirm("You already logged " + money(amt) + " to " + d.tag
        + " on this date. Add it a second time?")) return;
    list.push({ id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
                date:d.date, amount:amt, tag:d.tag, sub:d.subs.slice(), note:d.note.trim() });
    state.flash = money(amt)+" logged to "+d.tag+".";
  }
  save(list);
  state.draft = { amount:"", tag:null, subs:[], note:"", date:todayISO(), id:null };
  state.tagQuery = ""; state.showAllTags = false;
  render();
  setTimeout(function(){ if(state.flash){ state.flash=""; if(state.tab==="add") render(); } }, 2600);
}

/* ---------------- rows ---------------- */
function byNewest(a,b){
  if(a.date!==b.date) return a.date<b.date ? 1 : -1;
  return a.id<b.id ? 1 : -1;
}
function rowHTML(e, killable, act){
  var t = BY[e.tag] || {t:"spend", n:"Misc."};
  var sign = t.t==="in" ? "+" : "";
  var tap = act==="repeat" ? ' data-repeat="'+esc(e.id)+'"'
          : act==="edit"   ? ' data-edit="'+esc(e.id)+'"' : "";
  return '<div class="row">'
    + '<span style="color:'+TYPE[t.t].color+'">'+icon(e.tag, 19)+'</span>'
    + '<div class="body"'+tap+'>'
    +   '<div class="what">'+esc(e.note || subLabel(e) || e.tag)+'</div>'
    +   '<div class="meta">'+esc(e.tag)+(subLabel(e)?" \u00B7 "+esc(subLabel(e)):"")+'</div>'
    + '</div>'
    + '<div class="amt"'+(t.t==="in"?' style="color:var(--saved)"':'')+'>'+sign+money(e.amount)+'</div>'
    + (killable ? '<button class="more" data-more="'+esc(e.id)+'" aria-label="Options for this entry">'+ui("more",18)+'</button>' : '')
    + '</div>';
}

function monthTabs(sel, attr){
  var h = '<div class="months">';
  months(load()).forEach(function(m){
    h += '<button class="mbtn" data-'+attr+'="'+m+'" aria-pressed="'+(m===sel)+'">'+monthName(m)+'</button>';
  });
  return h + '</div>';
}

/* ---------------- ledger ---------------- */
function viewLedger(){
  var all = load();
  var m = state.ledgerMonth || months(all)[0];
  state.ledgerMonth = m;
  var q = state.ledgerQuery.trim().toLowerCase();

  var rows = all.filter(function(e){ return ym(e.date)===m; })
    .filter(function(e){
      if(!q) return true;
      return (e.tag+" "+subsOf(e).join(" ")+" "+e.note).toLowerCase().indexOf(q) > -1;
    }).sort(byNewest);

  var h = monthTabs(m,"lm")
    + '<input class="search" id="q" placeholder="Search this month" aria-label="Search entries" value="'+esc(state.ledgerQuery)+'">'
    + '<p class="small muted" style="margin:0 0 4px">Tap an entry to edit it.</p>';

  if(!rows.length){
    return h + '<p class="empty">Nothing logged for '+monthName(m)+'. Entries you add will appear here under the day you spent.</p>';
  }

  var seen = {};
  rows.forEach(function(e){
    if(!seen[e.date]){
      seen[e.date] = 1;
      var dayTotal = rows.reduce(function(s,x){
        return s + (x.date===e.date && (BY[x.tag]||{}).t==="spend" ? x.amount : 0);
      },0);
      h += '<div class="dayhead"><span>'+dayLabel(e.date)+'</span><span class="mono">'+money(dayTotal)+'</span></div>';
    }
    h += rowHTML(e, true, "edit");
  });
  return h;
}

/* ---------------- month ---------------- */
function prevMonth(m){
  var y = +m.slice(0,4), mo = +m.slice(5,7) - 1;
  if(mo === 0){ y--; mo = 12; }
  return y + "-" + pad(mo);
}
function tagTotal(m, name){
  return load().reduce(function(s,e){
    return s + (ym(e.date)===m && e.tag===name ? e.amount : 0);
  }, 0);
}
function deltaLine(now, then, m){
  if(!then) return "";
  var d = Math.round(now - then), label = monthName(m).split(" ")[0];
  if(Math.abs(d) < 1) return "level with " + label;
  return (d > 0 ? "up " : "down ") + money(Math.abs(d)) + " on " + label;
}

function summarise(m){
  var rows = load().filter(function(e){ return ym(e.date)===m; });
  var byType = {spend:0, saved:0, moved:0, "in":0};
  var byTag = {};
  var days = {};
  rows.forEach(function(e){
    var t = (BY[e.tag]||{t:"spend"}).t;
    byType[t] += e.amount;
    byTag[e.tag] = (byTag[e.tag]||0) + e.amount;
    days[e.date] = 1;
  });
  var spendTags = [], otherTags = [];
  Object.keys(byTag).forEach(function(n){
    ((BY[n]||{t:"spend"}).t==="spend" ? spendTags : otherTags).push([n, byTag[n]]);
  });
  var desc = function(a,b){ return b[1]-a[1]; };
  return { rows:rows, byType:byType, spendTags:spendTags.sort(desc), otherTags:otherTags.sort(desc),
           total:byType.spend, days:Object.keys(days).length };
}

function breakdownHTML(tagName, m){
  var rows = load().filter(function(e){ return ym(e.date)===m && e.tag===tagName; });
  var totals = {}, multi = false;
  rows.forEach(function(e){
    var subs = subsOf(e);
    if(subs.length > 1) multi = true;
    if(!subs.length) subs = ["Not specified"];
    var share = e.amount / subs.length;
    subs.forEach(function(sname){ totals[sname] = (totals[sname]||0) + share; });
  });
  var ordered = Object.keys(totals).map(function(k){ return [k, totals[k]]; })
                      .sort(function(a,b){ return b[1]-a[1]; });

  var pm = prevMonth(m), was = tagTotal(pm, tagName);
  var h = '<div class="bd">';
  if(was) h += '<p class="cmp">'+esc(monthName(pm))+': '+money(was)+' \u2014 '
             + esc(deltaLine(rows.reduce(function(a,e){ return a+e.amount; },0), was, pm))+'</p>';
  h += '<h4>By sub-tag</h4>';
  ordered.forEach(function(p){
    h += '<div class="sr"><span class="n">'+esc(p[0])+'</span>'
       + '<span class="mono">'+money(Math.round(p[1]))+'</span></div>';
  });
  if(multi) h += '<p class="small muted" style="margin:6px 0 0">Entries carrying several sub-tags are split evenly between them.</p>';

  h += '<h4>Entries</h4>';
  rows.slice().sort(byNewest).forEach(function(e){
    h += '<div class="en"><span class="n">'+esc(dayLabel(e.date))+' \u00B7 '
       + esc(e.note || subLabel(e) || "no note")+'</span>'
       + '<span class="mono">'+money(e.amount)+'</span></div>';
  });
  return h + '</div>';
}

function viewMonth(){
  var m = state.summaryMonth || months(load())[0];
  state.summaryMonth = m;
  var s = summarise(m);
  var pm = prevMonth(m), prevTotal = summarise(pm).total;

  var h = monthTabs(m,"sm")
    + '<div class="headline"><div class="big">'+money(s.total)+'</div>'
    + '<div class="sub">actually spent in '+monthName(m)
    + (s.days >= 3 ? ", about "+money(Math.round(s.total/s.days))+" a day across "+s.days+" days of entries" : "")
    + '</div>'
    + (prevTotal ? '<div class="delta">'+esc(deltaLine(s.total, prevTotal, pm))+'</div>' : "")
    + '</div>';

  if(!s.rows.length) return h + '<p class="empty">Nothing logged for this month yet.</p>';

  h += '<p class="small muted" style="margin:-4px 0 12px">Tap a tag to break it down.</p>';
  s.spendTags.forEach(function(p){
    var pct = s.total ? (p[1]/s.total*100) : 0, open = state.openTag===p[0];
    h += '<div class="bar"><button class="bartap" data-expand="'+esc(p[0])+'" aria-expanded="'+open+'">'
      + '<span class="t"><span>'+esc(p[0])+'<span class="caret">'+(open?"\u25B4":"\u25BE")+'</span></span>'
      + '<span class="mono">'+money(p[1])+' <span class="muted small">'+Math.round(pct)+'%</span></span></span>'
      + '<span class="track"><span class="fill" style="display:block;width:'+pct.toFixed(1)+'%"></span></span>'
      + '</button>'
      + (open ? breakdownHTML(p[0], m) : "")
      + '</div>';
  });

  if(s.otherTags.length){
    h += '<p class="small muted" style="margin:26px 0 6px">Money that moved but was not spent. Tap to break it down.</p>';
    s.otherTags.forEach(function(p){
      var t = (BY[p[0]]||{t:"moved"}).t, open = state.openTag===p[0];
      h += '<div><button class="bartap" data-expand="'+esc(p[0])+'" aria-expanded="'+open+'">'
        + '<span class="row" style="border-bottom:1px solid var(--band)">'
        +   '<span style="color:'+TYPE[t].color+'">'+icon(p[0],19)+'</span>'
        +   '<span class="body"><span class="what">'+esc(p[0])
        +     '<span class="caret">'+(open?"\u25B4":"\u25BE")+'</span></span>'
        +     '<span class="meta" style="display:block">'+TYPE[t].label+'</span></span>'
        +   '<span class="amt">'+money(p[1])+'</span>'
        + '</span></button>'
        + (open ? breakdownHTML(p[0], m) : "")
        + '</div>';
    });
  }

  h += '<div style="display:flex;gap:8px;margin:22px 0 8px">'
     + '<button class="primary" id="shareMonth" style="margin:0">Share this month</button>'
     + '</div>';
  return h;
}

function statementText(m){
  var s = summarise(m);
  var L = [];
  L.push(monthName(m) + " \u2014 my spending");
  L.push("");
  L.push("Total spent: " + money(s.total) + " across " + s.days + " day" + (s.days===1?"":"s"));
  L.push("");
  s.spendTags.forEach(function(p){
    L.push(p[0] + ": " + money(p[1]) + " (" + Math.round(s.total? p[1]/s.total*100 : 0) + "%)");
  });
  if(s.otherTags.length){
    L.push("");
    L.push("Moved but not spent:");
    s.otherTags.forEach(function(p){ L.push(p[0] + ": " + money(p[1])); });
  }
  L.push("");
  L.push("Every entry:");
  s.rows.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }).forEach(function(e){
    L.push(dayLabel(e.date) + " \u2014 " + (e.note || subLabel(e) || e.tag) + " \u2014 " + money(e.amount)
      + " [" + e.tag + (subLabel(e) ? ": " + subLabel(e) : "") + "]");
  });
  return L.join("\n");
}

/* ---------------- lent book ---------------- */
function personOf(e){
  var n = (e.note||"").trim();
  return n || subLabel(e) || "Unnamed";
}
function lentBook(){
  var by = {};
  load().forEach(function(e){
    var isOut = e.tag==="Lent";
    var isBack = e.tag==="Return" && subsOf(e).indexOf("Repaid to me") > -1;
    if(!isOut && !isBack) return;
    var name = personOf(e), k = name.toLowerCase();
    if(!by[k]) by[k] = { name:name, out:0, back:0, n:0 };
    if(isOut){ by[k].out += e.amount; by[k].n++; }
    else by[k].back += e.amount;
  });
  var all = Object.keys(by).map(function(k){
    var r = by[k]; r.due = r.out - r.back; return r;
  });
  return {
    open: all.filter(function(r){ return r.due > 0.5; }).sort(function(a,b){ return b.due - a.due; }),
    settled: all.filter(function(r){ return r.due <= 0.5; }).sort(function(a,b){ return b.out - a.out; }),
    total: all.reduce(function(s,r){ return s + Math.max(0, r.due); }, 0)
  };
}

function personHTML(r){
  var key = r.name.toLowerCase();
  var rows = load().filter(function(e){
    var mine = e.tag==="Lent" || (e.tag==="Return" && subsOf(e).indexOf("Repaid to me") > -1);
    return mine && personOf(e).toLowerCase() === key;
  }).sort(byNewest);

  var h = '<div class="bd">';
  h += '<p class="cmp">'+money(r.out)+' lent \u00B7 '+money(r.back)+' returned \u00B7 '
     + '<strong>'+money(Math.round(r.due))+' still to come back</strong></p>';
  h += '<h4>Every movement</h4>';
  rows.forEach(function(e){
    var back = e.tag==="Return";
    h += '<div class="en"><span class="n">'+esc(dayLabel(e.date))+' \u00B7 '
       + (back ? "returned" : "lent") + (subLabel(e) && !back ? " ("+esc(subLabel(e))+")" : "")
       + '</span><span class="mono"'+(back?' style="color:var(--saved)"':'')+'>'
       + (back?"+":"\u2212") + money(e.amount) + '</span></div>';
  });
  return h + '</div>';
}

function viewLent(){
  var b = lentBook();
  var h = '<div class="headline"><div class="big">'+money(Math.round(b.total))+'</div>'
        + '<div class="sub">still owed to you across '+b.open.length+' '
        + (b.open.length===1?"person":"people")+'</div></div>';

  if(!b.open.length && !b.settled.length){
    return h + '<p class="empty">Nothing lent yet. Entries tagged Lent show up here, '
      + 'and the name you put in the item field is who it went to.</p>';
  }

  if(b.open.length){
    b.open.forEach(function(r){
      var open = state.openPerson === r.name.toLowerCase();
      h += '<div><div class="lentrow">'
        + '<button class="who" data-person="'+esc(r.name)+'" aria-expanded="'+open+'">'
        +   '<span class="nm">'+esc(r.name)+'<span class="caret">'+(open?"\u25B4":"\u25BE")+'</span></span>'
        +   '<span class="bits">'+ (r.back
              ? 'lent '+money(r.out)+', '+money(r.back)+' back, '+money(Math.round(r.due))+' still out'
              : 'lent '+money(r.out)+' over '+r.n+' time'+(r.n===1?'':'s')+', nothing back yet')
        +   '</span></button>'
        + '<div class="out">'+money(Math.round(r.due))+'</div>'
        + '<button class="settle" data-settle="'+esc(r.name)+'">Got it back</button></div>'
        + (open ? personHTML(r) : "") + '</div>';
    });
  }else{
    h += '<p class="empty" style="padding:10px 0">Everything you lent has come back.</p>';
  }

  if(b.settled.length){
    h += '<p class="small muted" style="margin:24px 0 4px">Settled</p>';
    b.settled.forEach(function(r){
      h += '<div class="lentrow"><div class="who"><div class="nm">'+esc(r.name)+'</div>'
        + '<div class="bits">lent '+money(r.out)+', all '+money(r.back)+' returned</div></div></div>';
    });
  }

  h += '<p class="small muted" style="margin:22px 0 0">Tap "Got it back" to log the repayment. '
     + 'It fills in a Return entry with the amount and name already set.</p>';
  return h;
}

/* ---------------- data ---------------- */
function viewData(){
  var list = load();
  var span = list.length ? months(list).length : 0;
  return '<p style="margin:6px 0 18px;font-size:14px">'
    + list.length + ' entr' + (list.length===1?'y':'ies') + ' stored on this device'
    + (span ? ' over ' + span + ' month' + (span===1?'':'s') : '') + '.</p>'
    + '<p class="muted" style="font-size:13px;margin-bottom:18px">Everything lives in this browser only. '
    + 'Clearing site data wipes it, so take a backup now and then and keep the file somewhere safe.</p>'
    + '<button class="ghost" id="expCsv" style="width:100%;margin-bottom:8px">Export as CSV for a spreadsheet</button>'
    + '<button class="ghost" id="expJson" style="width:100%;margin-bottom:8px">Back up everything</button>'
    + '<button class="ghost" id="impJson" style="width:100%;margin-bottom:8px">Restore from a backup</button>'
    + '<button class="ghost" id="wipe" style="width:100%;border-color:var(--spend);color:var(--spend)">Delete all entries</button>';
}

function csvText(){
  var q = function(s){ return '"' + String(s==null?"":s).replace(/"/g,'""') + '"'; };
  var out = ["Date,Tag,Sub-tag,Item,Amount,Type"];
  load().slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }).forEach(function(e){
    var t = (BY[e.tag]||{t:"spend"}).t;
    out.push([e.date, q(e.tag), q(subsOf(e).join("; ")), q(e.note), e.amount, q(TYPE[t].label)].join(","));
  });
  return out.join("\n");
}

/* ---------------- sheet (copy / paste box) ---------------- */
function openSheet(title, body, opts){
  opts = opts || {};
  var veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML = '<div class="sheet">'
    + '<div class="sheethead"><h2>'+esc(title)+'</h2>'
    + '<button class="kill" data-close="1" aria-label="Close" style="font-size:22px">\u00D7</button></div>'
    + '<textarea '+(opts.editable?'':'readonly')+' spellcheck="false"'
    + (opts.placeholder?' placeholder="'+esc(opts.placeholder)+'"':'')+'>'+esc(body)+'</textarea>'
    + '<button class="primary" data-act="1">'+esc(opts.action || "Copy all")+'</button>'
    + '</div>';
  document.body.appendChild(veil);
  var ta = veil.querySelector("textarea");
  var btn = veil.querySelector("[data-act]");

  function close(){ veil.remove(); }
  veil.addEventListener("click", function(ev){
    if(ev.target===veil || ev.target.closest("[data-close]")) close();
  });
  btn.addEventListener("click", function(){
    if(opts.editable){
      if(opts.onSubmit(ta.value)) close();
      return;
    }
    ta.focus(); ta.select();
    var done = function(){ btn.textContent = "Copied. Paste it wherever you like."; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(done, function(){
        btn.textContent = "Press and hold the text above, then Copy.";
      });
    }else{
      try{ document.execCommand("copy"); done(); }
      catch(e){ btn.textContent = "Press and hold the text above, then Copy."; }
    }
  });
  if(!opts.editable){ ta.focus(); ta.select(); }
}

function openMenu(id){
  var e = load().filter(function(x){ return x.id===id; })[0];
  if(!e) return;
  var t = BY[e.tag] || {t:"spend"};
  var veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML = '<div class="sheet">'
    + '<div class="sheethead"><h2>'+esc(e.note || subLabel(e) || e.tag)+' \u2014 '+money(e.amount)+'</h2>'
    + '<button class="kill" data-close="1" aria-label="Close" style="font-size:22px">\u00D7</button></div>'
    + '<p class="menuhead">'+esc(e.tag)+(subLabel(e)?" \u00B7 "+esc(subLabel(e)):"")+' \u00B7 '+esc(dayLabel(e.date))+'</p>'
    + '<div class="menu">'
    +   '<button data-mact="edit">'+ui("edit")+'Edit this entry</button>'
    +   '<button data-mact="repeat">'+ui("again")+'Log it again today</button>'
    +   '<button class="danger" data-mact="delete">'+ui("trash")+'Delete</button>'
    + '</div></div>';
  document.body.appendChild(veil);
  veil.addEventListener("click", function(ev){
    if(ev.target===veil || ev.target.closest("[data-close]")){ veil.remove(); return; }
    var b = ev.target.closest("[data-mact]");
    if(!b) return;
    var act = b.dataset.mact;
    veil.remove();
    if(act==="edit"){
      state.draft = { amount:String(e.amount), tag:e.tag, subs:subsOf(e), note:e.note||"", date:e.date, id:e.id };
      state.tab = "add"; state.flash = ""; state.undo = null; render();
    }else if(act==="repeat"){
      state.draft = { amount:String(e.amount), tag:e.tag, subs:subsOf(e), note:e.note||"", date:todayISO(), id:null };
      state.tab = "add"; state.flash = ""; state.undo = null; render();
    }else if(act==="delete"){
      deleteEntry(e.id);
    }
  });
}

function deleteEntry(id){
  var list = load(), at = -1;
  list.forEach(function(e,i){ if(e.id===id) at = i; });
  if(at < 0) return;
  var gone = list[at];
  state.undo = { entry:gone, at:at };
  state.flash = "Deleted " + (gone.note || subLabel(gone) || gone.tag) + ".";
  list.splice(at,1);
  save(list);
  render();
  setTimeout(function(){
    if(state.undo && state.undo.entry.id===id){
      state.undo = null; state.flash = "";
      var fb = document.querySelector(".flashbar"); if(fb) fb.remove();
    }
  }, 8000);
}

/* ---------------- events ---------------- */
document.addEventListener("click", function(ev){
  var b;

  if((b = ev.target.closest("nav button"))){
    state.tab = b.dataset.tab;
    if(!state.undo) state.flash = "";
    render(); return;
  }
  if((b = ev.target.closest("[data-showall]"))){
    state.showAllTags = !state.showAllTags;
    var g0 = el("taggrid"); if(g0) g0.innerHTML = tagGridHTML();
    return;
  }
  if((b = ev.target.closest("[data-tag]"))){
    var name = b.dataset.tag, ps = b.dataset.picksub || null;
    if(state.draft.tag===name && (!ps || state.draft.subs.indexOf(ps)>-1)){
      state.draft.tag = null; state.draft.subs = [];
    }else{
      state.draft.tag = name; state.draft.subs = ps ? [ps] : [];
    }
    render(); return;
  }
  if((b = ev.target.closest("[data-sub]"))){
    var s = b.dataset.sub, at = state.draft.subs.indexOf(s);
    if(at > -1) state.draft.subs.splice(at,1); else state.draft.subs.push(s);
    render(); return;
  }
  if(ev.target.closest("#saveBtn")){ commitDraft(); return; }
  if(ev.target.closest("#cancelEdit")){
    state.draft = { amount:"", tag:null, subs:[], note:"", date:todayISO(), id:null };
    state.tagQuery = ""; render(); return;
  }
  if((b = ev.target.closest("[data-lm]"))){ state.ledgerMonth = b.dataset.lm; render(); return; }
  if((b = ev.target.closest("[data-sm]"))){ state.summaryMonth = b.dataset.sm; state.openTag = null; render(); return; }
  if((b = ev.target.closest("[data-expand]"))){
    state.openTag = state.openTag===b.dataset.expand ? null : b.dataset.expand;
    render(); return;
  }

  if((b = ev.target.closest("[data-more]"))){ openMenu(b.dataset.more); return; }
  if(ev.target.closest("[data-undo]")){
    if(state.undo){
      var list = load();
      list.splice(Math.min(state.undo.at, list.length), 0, state.undo.entry);
      save(list);
      state.undo = null; state.flash = "Restored.";
      render();
      setTimeout(function(){ state.flash=""; var fb=document.querySelector(".flashbar"); if(fb) fb.remove(); }, 2500);
    }
    return;
  }
  if((b = ev.target.closest("[data-person]"))){
    var k = b.dataset.person.toLowerCase();
    state.openPerson = state.openPerson===k ? null : k;
    render(); return;
  }
  if((b = ev.target.closest("[data-settle]"))){
    var who = b.dataset.settle, bk = lentBook();
    var rec = bk.open.filter(function(r){ return r.name===who; })[0];
    state.draft = { amount: rec ? String(Math.round(rec.due)) : "", tag:"Return",
                    subs:["Repaid to me"], note:who, date:todayISO(), id:null };
    state.tab = "add"; state.tagQuery = ""; state.flash = ""; state.undo = null;
    render(); return;
  }
  if(ev.target.closest("#clearAll")){
    state.draft = { amount:"", tag:null, subs:[], note:"", date:todayISO(), id:null };
    state.tagQuery = ""; state.showAllTags = false; state.flash = ""; state.undo = null;
    render(); return;
  }
  if((b = ev.target.closest("[data-edit]"))){
    var e1 = load().filter(function(x){ return x.id===b.dataset.edit; })[0];
    if(e1){
      state.draft = { amount:String(e1.amount), tag:e1.tag, subs:subsOf(e1), note:e1.note||"", date:e1.date, id:e1.id };
      state.tab = "add"; render();
    }
    return;
  }
  if((b = ev.target.closest("[data-repeat]"))){
    var e2 = load().filter(function(x){ return x.id===b.dataset.repeat; })[0];
    if(e2){
      state.draft = { amount:String(e2.amount), tag:e2.tag, subs:subsOf(e2), note:e2.note||"", date:todayISO(), id:null };
      render();
    }
    return;
  }

  if(ev.target.closest("#shareMonth")){
    openSheet("Statement for " + monthName(state.summaryMonth), statementText(state.summaryMonth));
    return;
  }
  if(ev.target.closest("#expCsv")){
    openSheet("All entries as CSV", csvText());
    return;
  }
  if(ev.target.closest("#expJson")){
    openSheet("Backup", JSON.stringify(load()));
    return;
  }
  if(ev.target.closest("#impJson")){
    openSheet("Restore from a backup", "", {
      editable:true, action:"Restore these entries",
      placeholder:"Paste the backup text here.",
      onSubmit:function(txt){
        var parsed;
        try{ parsed = JSON.parse(txt); }catch(err){ alert("That text isn't a backup file. Paste the whole thing, brackets included."); return false; }
        if(!Array.isArray(parsed)){ alert("That text isn't a backup file."); return false; }
        var mine = load(), have = {};
        mine.forEach(function(e){ have[e.id]=1; });
        var added = 0;
        parsed.forEach(function(e){
          if(e && e.id && e.date && e.tag && !have[e.id]){ mine.push(e); added++; }
        });
        save(mine);
        alert(added + " entr" + (added===1?"y":"ies") + " restored. Nothing already here was overwritten.");
        render();
        return true;
      }
    });
    return;
  }
  if(ev.target.closest("#wipe")){
    if(confirm("Delete every entry on this device? Back up first if you might want them back.")){
      save([]); render();
    }
    return;
  }
});

document.addEventListener("input", function(ev){
  var t = ev.target;
  if(t.id==="amount"){
    var v = t.value.replace(/[^0-9.]/g,"");
    var dot = v.indexOf(".");
    if(dot > -1) v = v.slice(0, dot+1) + v.slice(dot+1).replace(/\./g,"").slice(0,2);
    state.draft.amount = v;
    if(t.value !== v) t.value = v;
    syncSaveBtn();
  }
  else if(t.id==="date"){ state.draft.date = t.value || todayISO(); }
  else if(t.id==="note"){ state.draft.note = t.value; }
  else if(t.id==="tagq"){
    state.tagQuery = t.value;
    var g = el("taggrid"); if(g) g.innerHTML = tagGridHTML();
  }
  else if(t.id==="q"){ state.ledgerQuery = t.value; var pos=t.selectionStart; render(); var q2=el("q"); if(q2){ q2.focus(); q2.setSelectionRange(pos,pos); } }
});

/* keeps the save button live without re-rendering (which would steal focus) */
function syncSaveBtn(){
  var btn = el("saveBtn"); if(!btn) return;
  var d = state.draft, amt = parseFloat(d.amount), ok = amt>0 && !!d.tag;
  btn.disabled = !ok;
  btn.textContent = ok ? (d.id ? "Update this entry" : "Add " + money(amt) + " to " + d.tag)
                       : "Enter an amount and pick a tag";
}

render();

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
